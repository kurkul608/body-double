version: 2
updates:
  # npm ecosystem also handles pnpm workspaces and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # fix(deps) → patch release, so SDK bumps (new model aliases) ship fast.
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
